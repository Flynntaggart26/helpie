<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Helpie</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #14161a;
        --fg: #e8eaed;
        --muted: #9aa0a6;
        --accent: #6ea8fe;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        background: radial-gradient(120% 120% at 50% 0%, #1d2129 0%, var(--bg) 60%);
        color: var(--fg);
        font-family: "Segoe UI", system-ui, sans-serif;
        user-select: none;
        -webkit-app-region: drag;
      }
      .card { text-align: center; padding: 32px; }
      .mark {
        width: 64px; height: 64px; margin: 0 auto 20px;
        border-radius: 18px;
        background: linear-gradient(145deg, #3b82f6, #6366f1);
        box-shadow: 0 12px 32px rgba(59, 130, 246, 0.35);
        display: grid; place-items: center;
        font-size: 30px; font-weight: 700; color: #fff;
      }
      h1 { font-size: 22px; font-weight: 600; margin: 0 0 6px; letter-spacing: 0.2px; }
      p { margin: 0; color: var(--muted); font-size: 13px; }
      .bar {
        margin: 22px auto 0; width: 180px; height: 3px;
        border-radius: 999px; background: rgba(255, 255, 255, 0.08); overflow: hidden;
      }
      .bar span {
        display: block; width: 40%; height: 100%; border-radius: inherit;
        background: var(--accent);
        animation: slide 1.2s ease-in-out infinite;
      }
      @keyframes slide {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(280%); }
      }
      .status { margin-top: 14px; font-size: 12px; color: #6b7280; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">H</div>
      <h1>Helpie</h1>
      <p>Starting your assistant…</p>
      <div class="bar"><span></span></div>
      <div class="status" id="status">Loading backend</div>
    </div>
    <script>
      // The Rust side navigates to the local server as soon as /api/health answers.
      // If that takes unusually long, say so instead of spinning forever.
      const status = document.getElementById("status");
      window.setTimeout(() => {
        status.textContent = "First launch can take up to a minute";
      }, 15000);
    </script>
  </body>
</html>
