name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version matches tag
        shell: pwsh
        run: |
          $version = (Get-Content VERSION).Trim()
          $tag = $env:GITHUB_REF_NAME
          if ($tag -and $tag -ne "v$version") {
            throw "VERSION ($version) does not match tag ($tag). Bump VERSION before tagging."
          }
          Write-Host "Version $version"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller pillow

      - name: Build Python sidecar
        shell: pwsh
        run: python build_sidecar.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build Tauri installer
        shell: pwsh
        run: npx --yes @tauri-apps/cli@2 build

      - name: Build source zip
        shell: pwsh
        run: |
          $version = (Get-Content VERSION).Trim()
          $name = "helpie-v$version.zip"
          git archive --format=zip --output=$name HEAD
          Write-Host "Created $name"

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content VERSION).Trim()
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          $zip = "helpie-v$version.zip"
          $notes = @"
          Helpie $env:GITHUB_REF_NAME

          Windows 10/11 (WebView2). Download the ``-setup.exe`` installer and run it - no Python required.
          The installer is per-user, so no administrator rights are needed.

          Existing installs update themselves from Settings, or automatically on startup when a newer release exists.
          "@
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME $installer.FullName $zip --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME $installer.FullName $zip `
              --title "Helpie $env:GITHUB_REF_NAME" `
              --notes $notes
          }
