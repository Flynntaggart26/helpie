name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version matches tag
        shell: pwsh
        run: |
          $version = (Get-Content VERSION).Trim()
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $tag = $env:GITHUB_REF_NAME
            if ($tag -ne "v$version") {
              throw "VERSION ($version) does not match tag ($tag). Bump VERSION before tagging."
            }
          }
          Write-Host "Version $version"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Run Python behavior checks
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: Build Python sidecar
        shell: pwsh
        run: python build_sidecar.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check frontend JavaScript syntax
        shell: pwsh
        run: |
          node --check ui/app.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check ui/geometry-edit.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check ui/note-pdf.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check ui/note-svg.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/test_geometry_edit.cjs tests/test_note_pdf.cjs tests/test_note_svg.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Tauri installer
        shell: pwsh
        run: npx --yes @tauri-apps/cli@2 build

      - name: Build source archive
        shell: pwsh
        run: |
          $version = (Get-Content VERSION).Trim()
          $name = "helpie-v$version.zip"
          git archive --format=zip --output=$name HEAD
          Write-Host "Created $name"

      - name: Build portable archive
        shell: pwsh
        run: |
          $version = (Get-Content VERSION).Trim()
          $stage = "portable-stage/helpie-portable-v$version"
          Remove-Item "portable-stage" -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item "src-tauri/target/release/helpie.exe" "$stage/helpie.exe"
          Copy-Item "src-tauri/sidecar/helpie-core" "$stage/helpie-core" -Recurse
          Copy-Item "packaging/portable/basla.bat" "$stage/basla.bat"
          $readme = Get-Content "packaging/portable/README-PORTABLE.txt" -Raw
          $readme.Replace("__VERSION__", $version) | Set-Content "$stage/README-PORTABLE.txt" -NoNewline
          Compress-Archive -Path "$stage/*" -DestinationPath "Helpie_${version}_x64-portable.zip" -Force
          Write-Host "Created Helpie_${version}_x64-portable.zip"

      - name: Write release notes
        shell: pwsh
        run: |
          $version = (Get-Content VERSION).Trim()
          $setup = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          $portable = Get-Item "Helpie_${version}_x64-portable.zip"
          $source = Get-Item "helpie-v$version.zip"
          $notes = Get-Content "packaging/release-notes.md" -Raw
          $notes = $notes.Replace("__VERSION__", $version)
          $notes = $notes.Replace("__SETUP_NAME__", $setup.Name)
          $notes = $notes.Replace("__SETUP_SIZE__", $setup.Length.ToString("N0"))
          $notes = $notes.Replace("__SETUP_SHA__", (Get-FileHash $setup.FullName -Algorithm SHA256).Hash)
          $notes = $notes.Replace("__PORTABLE_NAME__", $portable.Name)
          $notes = $notes.Replace("__PORTABLE_SIZE__", $portable.Length.ToString("N0"))
          $notes = $notes.Replace("__PORTABLE_SHA__", (Get-FileHash $portable.FullName -Algorithm SHA256).Hash)
          $notes = $notes.Replace("__SOURCE_NAME__", $source.Name)
          $notes = $notes.Replace("__SOURCE_SIZE__", $source.Length.ToString("N0"))
          $notes = $notes.Replace("__SOURCE_SHA__", (Get-FileHash $source.FullName -Algorithm SHA256).Hash)
          $notes | Set-Content "release-notes.md" -NoNewline
          Write-Host "Wrote release-notes.md"

      - name: Upload candidate build for desktop review
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: helpie-windows-candidate-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            Helpie_*_x64-portable.zip
            helpie-v*.zip
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content VERSION).Trim()
          $tag = "v$version"
          $setup = (Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1).FullName
          $portable = "Helpie_${version}_x64-portable.zip"
          $source = "helpie-v$version.zip"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $setup $portable $source --clobber
          } else {
            gh release create $tag $setup $portable $source --title "Helpie $tag" --notes-file "release-notes.md"
          }
