[package]
name = "helpie"
version = "1.16.14"
description = "Helpie - voice assistant for Windows"
authors = ["Flynntaggart26"]
edition = "2021"
rust-version = "1.85"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
getrandom = "0.3"

[target.'cfg(windows)'.dependencies]
png = "0.18.1"
windows-capture = "2.0.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
