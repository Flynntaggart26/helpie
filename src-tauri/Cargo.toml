[package]
name = "helpie"
version = "1.16.3"
description = "Helpie - voice assistant for Windows"
authors = ["Flynntaggart26"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
getrandom = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
